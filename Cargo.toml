[workspace]
resolver = "2"
members = [
    "crates/reliableq-core",
    "crates/reliableq-db",
    "crates/reliableq-api",
    "crates/reliableq-worker",
    "crates/fake-charge",
    "tests/integration",
    "tests/chaos",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
reliableq-core = { path = "crates/reliableq-core" }
reliableq-db = { path = "crates/reliableq-db" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
axum = { version = "0.8" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
rand = "0.8"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"

[profile.dev]
debug = 1
